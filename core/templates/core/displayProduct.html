
{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h1 class="text-primary">Received Product Details</h1>

    <table class="table table-bordered table-striped mt-3">
        <tr>
            <th>Product Name</th>
            <td>{{ product.product_name }}</td>
        </tr>
        <tr>
            <th>Product Company</th>
            <td>{{ product.product_company }}</td>
        </tr>
        <tr>
            <th>Product Price</th>
            <td>{{ product.product_price }}</td>
        </tr>
    </table>

    <a href="{% url 'insertForm' %}" class="btn btn-success">
        Add Another Product
    </a>
</div>
{% endblock %}
